<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Credit Customers | AquaFlow</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    
    <!-- Theme CSS -->
    <link rel="stylesheet" href="/static/style.css?v=20">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="/" style="text-decoration: none; color: inherit;">
            <div class="brand">
                <ion-icon name="water"></ion-icon>
                <span>AquaFlow CRM</span>
            </div>
        </a>
        <div style="margin-left: auto;">
             <a href="/" class="btn-secondary">
                <ion-icon name="arrow-back-outline"></ion-icon> Back to Dashboard
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="main-container">

        <!-- Header -->
        <div class="header-wrapper" style="margin-bottom: 2rem;">
            <h1>Monthly Credit Customers</h1>
            <p>List of customers who pay on a monthly basis.</p>
        </div>

        <!-- Customer List -->
        <div class="table-container fade-in-up">
            <table class="data-table">
                <thead>
                    <tr>
                        <th width="40%">Customer Name</th>
                        <th width="40%">Mobile Number</th>
                        <th width="20%" class="text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="monthlyTableBody">
                    <tr><td colspan="3" class="text-center">Loading...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        const API_BASE = "";

        document.addEventListener('DOMContentLoaded', () => {
            fetchMonthlyCustomers();
        });

        async function fetchMonthlyCustomers() {
            try {
                const res = await fetch(`${API_BASE}/monthly/customers`);
                if (!res.ok) throw new Error('Failed to fetch');
                const customers = await res.json();
                renderTable(customers);
            } catch (err) {
                console.error(err);
                document.getElementById('monthlyTableBody').innerHTML = '<tr><td colspan="3" class="text-center" style="color:red">Error loading data</td></tr>';
            }
        }

        function renderTable(customers) {
            const tbody = document.getElementById('monthlyTableBody');
            tbody.innerHTML = '';
            
            if (!customers || customers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center">No monthly credit customers found.</td></tr>';
                return;
            }

            customers.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="cell-name" style="font-weight: 600; font-size: 1.1rem;">${escapeHtml(c.customer_name)}</div>
                    </td>
                    <td>
                        <div style="font-family: monospace; font-size: 1rem;">${escapeHtml(c.customer_number)}</div>
                    </td>
                    <td class="text-right">
                        <a href="/static/monthly_detail.html?id=${c.id}" class="btn-primary" style="text-decoration: none; padding: 0.5rem 1rem; display: inline-flex; align-items: center; gap: 5px;">
                            View Details <ion-icon name="arrow-forward-outline"></ion-icon>
                        </a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
